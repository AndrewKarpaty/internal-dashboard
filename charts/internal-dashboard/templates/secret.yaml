apiVersion: v1
kind: Secret
metadata:
  name: {{ include "internal-dashboard.fullname" . }}-api
  labels:
    {{- include "internal-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-password: {{ include "internal-dashboard.redisPassword" . | quote }}
  redis-uri: redis://:{{ include "internal-dashboard.redisPassword" . }}@{{ include "internal-dashboard.fullname" . }}-redis:{{ .Values.redis.port }}/0
