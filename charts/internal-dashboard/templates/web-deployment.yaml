apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "internal-dashboard.fullname" . }}-web
  labels:
    {{- include "internal-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "internal-dashboard.web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "internal-dashboard.web.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/web-configmap.yaml") . | sha256sum }}
    spec:
      {{- include "internal-dashboard.podSecurityContext" (dict "runAsUser" 10001) | nindent 6 }}
      initContainers:
        - name: frontend-build
          image: "{{ .Values.web.frontend.repository }}:{{ .Values.web.frontend.tag }}"
          imagePullPolicy: {{ .Values.web.frontend.pullPolicy }}
          {{- include "internal-dashboard.containerSecurityContext" . | nindent 10 }}
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: static
              mountPath: /out
            - name: tmp
              mountPath: /tmp
      containers:
        - name: caddy
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          {{- include "internal-dashboard.containerSecurityContext" . | nindent 10 }}
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          ports:
            - name: http
              containerPort: {{ .Values.web.containerPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: static
              mountPath: /srv/www
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: caddy-data
              mountPath: /data
            - name: caddy-config-dir
              mountPath: /config
      volumes:
        - name: static
          emptyDir: {}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: caddy-data
          emptyDir:
            sizeLimit: 16Mi
        - name: caddy-config-dir
          emptyDir:
            sizeLimit: 16Mi
        - name: caddy-config
          configMap:
            name: {{ include "internal-dashboard.fullname" . }}-web
