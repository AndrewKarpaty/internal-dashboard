apiVersion: v1
kind: Service
metadata:
  name: {{ include "internal-dashboard.fullname" . }}-api
  labels:
    {{- include "internal-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "internal-dashboard.api.selectorLabels" . | nindent 4 }}
